x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
x-app: &app
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  networks: [app]
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    logging: *logging
    networks: [app]
  redis:
    image: redis:7.4-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 24
    logging: *logging
    networks: [app]
  api:
    <<: *app
    image: ${API_IMAGE:?Set API_IMAGE}
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: '3001'
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3001/health", {signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
  web:
    <<: *app
    image: ${WEB_IMAGE:?Set WEB_IMAGE}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache:uid=1000,gid=1000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000", {signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 15s
  proxy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - '${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443'
      - '${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    logging: *logging
    networks: [app]
networks:
  app:
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
